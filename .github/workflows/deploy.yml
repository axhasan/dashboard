name: Deploy Dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inject secrets into index.html
        env:
          DASH_GOOGLE_CLIENT_ID: ${{ secrets.DASH_GOOGLE_CLIENT_ID }}
          DASH_CLAUDE_KEY: ${{ secrets.DASH_CLAUDE_KEY }}
          DASH_ALPHA_KEY: ${{ secrets.DASH_ALPHA_KEY }}
          DASH_WEATHER_KEY: ${{ secrets.DASH_WEATHER_KEY }}
          DASH_GITHUB_PAT: ${{ secrets.DASH_GITHUB_PAT }}
        run: |
          sed -i \
            -e "s|%%DASH_GOOGLE_CLIENT_ID%%|${DASH_GOOGLE_CLIENT_ID}|g" \
            -e "s|%%DASH_CLAUDE_KEY%%|${DASH_CLAUDE_KEY}|g" \
            -e "s|%%DASH_ALPHA_KEY%%|${DASH_ALPHA_KEY}|g" \
            -e "s|%%DASH_WEATHER_KEY%%|${DASH_WEATHER_KEY}|g" \
            -e "s|%%DASH_GITHUB_PAT%%|${DASH_GITHUB_PAT}|g" \
            index.html
          echo "Secrets injected successfully"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
